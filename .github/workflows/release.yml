name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v1.2.3"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if missing
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; reusing it."
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  build:
    needs: create-release
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: secret-stripper-linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: secret-stripper-linux-aarch64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: secret-stripper-macos-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: secret-stripper-macos-aarch64
            ext: ""
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            asset: secret-stripper-windows-x86_64.exe
            ext: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: secret-stripper-windows-aarch64.exe
            ext: ".exe"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/secret-stripper${{ matrix.ext }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/secret-stripper${{ matrix.ext }}" "dist/${{ matrix.asset }}"

      - name: Upload asset to release
        shell: bash
        run: gh release upload "$RELEASE_TAG" "dist/${{ matrix.asset }}" --clobber

  checksums:
    needs: build
    name: Publish SHA256SUMS
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        run: |
          mkdir -p dist
          cd dist
          gh release download "$RELEASE_TAG" --pattern 'secret-stripper-*' --clobber

      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          sha256sum secret-stripper-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        working-directory: dist
        run: gh release upload "$RELEASE_TAG" SHA256SUMS --clobber

  publish-crate:
    needs: checksums
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Check for crates.io token
        id: check
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set - skipping crates.io publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.skip == 'false'
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux system dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libdbus-1-dev

      - name: Install Rust toolchain
        if: steps.check.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target dir
        if: steps.check.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  publish-release:
    needs: publish-crate
    name: Flip draft to published
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        run: gh release edit "$RELEASE_TAG" --draft=false
